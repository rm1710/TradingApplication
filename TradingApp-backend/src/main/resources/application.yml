spring:
  application:
    name: TradingApp

  datasource:
    url: jdbc:postgresql://localhost:5432/trading_db
    username: postgres
    password: pass123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8000